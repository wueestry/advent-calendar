{% extends "base.html" %}

{% block title %}Anmelden — Adventskalender{% endblock %}

{% block content %}
  <section class="auth-card">
    <p class="hero-eyebrow">Geschützter Bereich</p>
    <h1>Anmelden</h1>
    <p class="subtitle">
      Bitte melden Sie sich an, um den Adventskalender zu öffnen.
    </p>

    <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <input type="hidden" name="next" value="{{ next_url }}" />

      <div class="form-group">
        <label for="username">Benutzername</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password">Passwort</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block">
        Kalender öffnen
      </button>
    </form>
  </section>
{% endblock %}
