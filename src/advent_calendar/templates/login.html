{% extends "base.html" %}

{% block title %}Sign In — Advent Calendar{% endblock %}

{% block content %}
  <section class="auth-card">
    <h1>Sign In</h1>
    <p class="subtitle">Enter your credentials to open the Advent Calendar.</p>

    <form method="post" action="{{ url_for('auth.login') }}" class="auth-form">
      <input type="hidden" name="next" value="{{ next_url }}" />

      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          autofocus
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Unlock Calendar</button>
    </form>
  </section>
{% endblock %}
