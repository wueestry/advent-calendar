[project]
name = "advent-calendar"
version = "0.1.0"
description = "Flask Advent Calendar with login protection and date-gated SUID door pages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=22.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
advent-calendar = "advent_calendar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advent_calendar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
